# Nginx site for the presentation container (deploy/docker-compose.yml, APP_BIND=127.0.0.1, PORT=9632).
# Install:
#   sudo cp presentation.inovsoft.online.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/presentation.inovsoft.online.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Add HTTPS with `sudo certbot --nginx -d presentation.inovsoft.online`.

upstream presentation_app {
    server 127.0.0.1:9632;  # = PORT in the VPS .env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name presentation.inovsoft.online;

    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://presentation_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # socket.io: WebSocket upgrade, long-lived connections
    location /socket.io/ {
        proxy_pass http://presentation_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed build files never change: cache them for a year
    location /assets/ {
        proxy_pass http://presentation_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
